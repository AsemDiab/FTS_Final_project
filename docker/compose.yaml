
services:
  postgres:
    image: postgres:17
    container_name: final_project_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: final_project
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d final_project"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
