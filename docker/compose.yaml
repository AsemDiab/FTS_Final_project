

services:
  postgres:
    image: postgres:17
    container_name: final_project_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: final_project
      POSTGRES_USER: AsemDiab
      POSTGRES_PASSWORD: "12345"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U AsemDiab -d final_project"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: final_project_server
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
